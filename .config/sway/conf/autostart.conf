#------------------------------------------------------------------------------
# `exec` runs once at startup (like Hyprland's exec-once), not on reload.



# Monitor come schermo principale: focus all'avvio
exec swaymsg focus output HDMI-A-2

exec waybar
exec swaync
exec nm-applet --indicator
exec /usr/libexec/polkit-mate-authentication-agent-1

# SSH agent (systemd --user, socket-activated). SSH_AUTH_SOCK is exported in
# ~/.config/environment.d/91-ssh-agent.conf; keys are added on first use
# with `AddKeysToAgent yes` in ~/.ssh/config.
exec systemctl --user start ssh-agent.socket

# Setup screen sharing (xdg-desktop-portal-wlr)
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY SWAYSOCK SSH_AUTH_SOCK XDG_CURRENT_DESKTOP=sway

# Setup clipboard
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store
