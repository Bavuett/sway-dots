#-----------------------------------------------------------------------------------
# Vanilla sway has no blur, shadows, rounded corners or animations.



font pango:JetBrainsMono Nerd Font 10

# Gaps: 8px between windows and at the screen edges
gaps inner 8
gaps outer 0

# Borders only, no title bars (title bars still show in tabbed/stacked layouts)
default_border pixel 2
default_floating_border pixel 2
hide_edge_borders none

# class                 border    bg        text      indicator child_border
client.focused          #f697aa   #f697aa   #4b2a30   #f6af97   #f697aa
client.focused_inactive #8c4e5b   #8c4e5b   #faf1ef   #8c4e5b   #8c4e5b
client.unfocused        #6e3a47   #6e3a47   #c69aa3   #6e3a47   #8c4e5b
client.urgent           #ffb3c1   #ffb3c1   #4b2a30   #ffb3c1   #ffb3c1
client.background       #6e3a47

# Cursor
seat * xcursor_theme default 24
