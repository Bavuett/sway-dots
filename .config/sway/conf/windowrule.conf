# Find a window's app_id with: swaymsg -t get_tree | grep app_id



# Frosted glass — terminal opacity
for_window [app_id="kitty"] opacity 0.70

# Float rules for common apps (criteria are unanchored regexes)
for_window [app_id="org.gnome.Nautilus" title="^$"] floating enable
for_window [app_id="pavucontrol"] floating enable
for_window [app_id="nm-connection-editor"] floating enable
for_window [app_id="blueman-manager"] floating enable
