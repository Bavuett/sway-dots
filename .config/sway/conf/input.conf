# List devices with: swaymsg -t get_inputs



input type:keyboard {
    xkb_layout it
}

input type:pointer {
    accel_profile flat
    pointer_accel 0
}

input type:touchpad {
    tap enabled
    natural_scroll enabled
    scroll_factor 0.5
    accel_profile flat
    pointer_accel 0
}

focus_follows_mouse yes

# 3-finger horizontal swipe switches workspace
bindgesture swipe:3:left workspace next_on_output
bindgesture swipe:3:right workspace prev_on_output
