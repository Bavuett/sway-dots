#--------------------------------------------------------------------
# List outputs with: swaymsg -t get_outputs
# Example: output DP-1 mode 2560x1440@144Hz position 0 0 scale 1



output * scale 1

# Monitor Samsung (HDMI) sopra, portatile (eDP-1) sotto.
# Sway non ha un vero "schermo principale": il monitor lo diventa perché
# riceve il focus all'avvio (autostart.conf) e i workspace 1-5.
output HDMI-A-2 position 0 0
output eDP-1 position 0 1080

# Workspace 1-5 sul monitor (ripiegano sul portatile se è scollegato), 6-10 sul portatile
workspace 1 output HDMI-A-2 eDP-1
workspace 2 output HDMI-A-2 eDP-1
workspace 3 output HDMI-A-2 eDP-1
workspace 4 output HDMI-A-2 eDP-1
workspace 5 output HDMI-A-2 eDP-1
workspace 6 output eDP-1
workspace 7 output eDP-1
workspace 8 output eDP-1
workspace 9 output eDP-1
workspace 10 output eDP-1

# Wallpaper (drawn by swaybg)
output * bg ~/.config/sway/wallpaper.jpg fill
