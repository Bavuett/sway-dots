bindsym $mainMod+space exec $terminal
bindsym $mainMod+e exec $fileManager
bindsym $mainMod+b exec $browser

bindsym $mainMod+Shift+Control+Escape exit
# Sway does not auto-reload on save like Hyprland does
bindsym $mainMod+Shift+c reload
bindsym $mainMod+Shift+w exec "pkill waybar; pkill swaync; waybar & swaync &"
bindsym $mainMod+q kill
bindsym $mainMod+Shift+q exec "swaymsg -t get_tree | jq -r '.. | select(.focused? == true) | .pid // empty' | xargs -r kill"

bindsym $mainMod+f floating toggle
bindsym $mainMod+Shift+f fullscreen toggle
bindsym $mainMod+j layout toggle split

bindsym $mainMod+l exec swaylock -f
bindsym Mod1+space exec $launcher
bindsym $mainMod+v exec "cliphist list | wofi --dmenu | cliphist decode | wl-copy"
bindsym $mainMod+Shift+s exec $scripts/screenshot.sh

# Show Hotkeys Cheat Sheet
bindsym $mainMod+h exec $scripts/cheatsheet.sh

# Move focus with mainMod + arrow keys
bindsym $mainMod+Left focus left
bindsym $mainMod+Right focus right
bindsym $mainMod+Up focus up
bindsym $mainMod+Down focus down

# Switch workspaces with mainMod + [0-9]
bindsym $mainMod+1 workspace number 1
bindsym $mainMod+2 workspace number 2
bindsym $mainMod+3 workspace number 3
bindsym $mainMod+4 workspace number 4
bindsym $mainMod+5 workspace number 5
bindsym $mainMod+6 workspace number 6
bindsym $mainMod+7 workspace number 7
bindsym $mainMod+8 workspace number 8
bindsym $mainMod+9 workspace number 9
bindsym $mainMod+0 workspace number 10

# Move active window to a workspace (and follow it) with mainMod + SHIFT + [0-9]
bindsym $mainMod+Shift+1 move container to workspace number 1; workspace number 1
bindsym $mainMod+Shift+2 move container to workspace number 2; workspace number 2
bindsym $mainMod+Shift+3 move container to workspace number 3; workspace number 3
bindsym $mainMod+Shift+4 move container to workspace number 4; workspace number 4
bindsym $mainMod+Shift+5 move container to workspace number 5; workspace number 5
bindsym $mainMod+Shift+6 move container to workspace number 6; workspace number 6
bindsym $mainMod+Shift+7 move container to workspace number 7; workspace number 7
bindsym $mainMod+Shift+8 move container to workspace number 8; workspace number 8
bindsym $mainMod+Shift+9 move container to workspace number 9; workspace number 9
bindsym $mainMod+Shift+0 move container to workspace number 10; workspace number 10

# Scroll through existing workspaces with mainMod + scroll
bindsym --whole-window $mainMod+button5 workspace next_on_output
bindsym --whole-window $mainMod+button4 workspace prev_on_output

# Move/resize windows with mainMod + LMB/RMB and dragging
floating_modifier $mainMod normal

# Laptop multimedia keys for volume and LCD brightness
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindsym --locked XF86MonBrightnessUp exec brightnessctl s 10%+
bindsym --locked XF86MonBrightnessDown exec brightnessctl s 10%-

# Media control (requires playerctl)
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPrev exec playerctl previous

# ===================================================================
# i3-like Resize Mode
# ===================================================================

bindsym $mainMod+r mode "resize"

mode "resize" {
    # Use arrow keys to resize the active window
    bindsym Right resize grow width 20px
    bindsym Left resize shrink width 20px
    bindsym Up resize shrink height 20px
    bindsym Down resize grow height 20px

    # Also support hjkl for vim-like resizing
    bindsym l resize grow width 20px
    bindsym h resize shrink width 20px
    bindsym k resize shrink height 20px
    bindsym j resize grow height 20px

    # Exit the mode when Escape or Enter is pressed
    bindsym Escape mode "default"
    bindsym Return mode "default"
}
