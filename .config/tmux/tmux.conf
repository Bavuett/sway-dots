# ── Base ────────────────────────────────────────────────────────────
set -g mouse on                      # clic per selezionare pane/finestre, trascina per ridimensionare, rotella per scorrere
set -g base-index 1                  # finestre numerate da 1 (comodo sulla tastiera)
setw -g pane-base-index 1
set -g renumber-windows on           # niente buchi nella numerazione quando chiudi una finestra
set -g history-limit 50000
set -sg escape-time 10               # Esc immediato (neovim)
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-kitty:RGB"   # true color in kitty
setw -g mode-keys vi                 # nella modalità copia: h j k l, v per selezionare, y per copiare

# ── Scorciatoie (prefix = Ctrl+b) ───────────────────────────────────
# Split più intuitivi, nella cartella corrente: | verticale, - orizzontale
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
# Ricarica la config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config ricaricata"
# Copia negli appunti di sistema (Wayland)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"

# ── Scorciatoie con Alt, senza prefix ───────────────────────────────
# Nuovo riquadro: divide nel verso del lato più lungo
bind -n M-Enter if -F "#{e|>:#{pane_width},#{e|*:#{pane_height},2}}" \
    'split-window -h -c "#{pane_current_path}"' \
    'split-window -v -c "#{pane_current_path}"'
# Muoversi tra i riquadri
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
# Ridimensionare
bind -n M-S-Left  resize-pane -L 3
bind -n M-S-Right resize-pane -R 3
bind -n M-S-Up    resize-pane -U 2
bind -n M-S-Down  resize-pane -D 2
# Schede
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
# Chiudere riquadro, zoom, scorrere/copiare
bind -n M-w kill-pane
bind -n M-z resize-pane -Z
bind -n M-PageUp copy-mode -u

# ── Aspetto (palette Pastel Pink Flower) ────────────────────────────
set -g status-position bottom
set -g status 2                      # riga 1: informazioni · riga 2: promemoria tasti
set -g status-interval 3
set -g status-style "bg=#6e3a47,fg=#faf1ef"

# Sinistra: sessione
set -g status-left "#[bg=#f697aa,fg=#4b2a30,bold]  #S #[default] "
set -g status-left-length 30

# Destra: modalità (PREFIX / COPIA / ZOOM) + cartella e ramo git del riquadro attivo
set -g status-right "#{?client_prefix,#[bg=#f7d6a0#,fg=#4b2a30#,bold] PREFIX #[default] ,}#{?pane_in_mode,#[bg=#b8b8f0#,fg=#4b2a30#,bold] COPIA #[default] ,}#{?window_zoomed_flag,#[bg=#a8e5c6#,fg=#4b2a30#,bold] ZOOM #[default] ,}#[fg=#e8c9cf] #{=/-45/…:#{s|^/home/[^/]+|~|:pane_current_path}}#[fg=#f697aa,bold]#(~/.config/tmux/scripts/git-status.sh '#{pane_current_path}') "
set -g status-right-length 100

# Schede: nome = programma in esecuzione; • se c'è attività, ! se suona la campanella
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-format " #I #W#{?window_activity_flag, •,}#{?window_bell_flag, !,} "
setw -g window-status-current-format "#[bg=#8c4e5b,fg=#f697aa,bold] #I #W#{?window_zoomed_flag, 󰊓,} "
setw -g window-status-activity-style "fg=#f7d6a0"
setw -g window-status-bell-style "fg=#ffb3c1,bold"

# Seconda riga: promemoria tasti
set -g status-format[1] "#[align=centre,fg=#c69aa3]Alt+⏎ nuovo  ·  Alt+←→↑↓ sposta  ·  Alt+⇧+frecce ridimensiona  ·  Alt+t scheda  ·  Alt+1…9 vai  ·  Alt+w chiudi  ·  Alt+z zoom  ·  Alt+PagSu scorri  ·  Ctrl+b d stacca"

set -g pane-border-style "fg=#8c4e5b"
set -g pane-active-border-style "fg=#f697aa"
set -g message-style "bg=#f697aa,fg=#4b2a30"
set -g mode-style "bg=#f697aa,fg=#4b2a30"
