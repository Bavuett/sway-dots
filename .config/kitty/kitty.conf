# ██╗  ██╗██╗████████╗████████╗██╗   ██╗
# ██║ ██╔╝██║╚══██╔══╝╚══██╔══╝╚██╗ ██╔╝
# █████╔╝ ██║   ██║      ██║    ╚████╔╝
# ██╔═██╗ ██║   ██║      ██║     ╚██╔╝
# ██║  ██╗██║   ██║      ██║      ██║
# ╚═╝  ╚═╝╚═╝   ╚═╝      ╚═╝      ╚═╝
# Pastel Pink Flower — dark rose scheme (from the Zed theme + wallpaper)
#----------------------------------------------------

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Cursor
cursor                  #f6af97
cursor_text_color       #4b2a30
cursor_shape            block
cursor_blink_interval   0.5

# Scrollback
scrollback_lines 10000

# Mouse
mouse_hide_wait 3.0
copy_on_select  no

# Window
window_padding_width    12
window_padding_height   12
background_opacity      0.95
dynamic_background_color no

# Tab bar
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{title}"
active_tab_foreground   #4b2a30
active_tab_background   #f697aa
active_tab_font_style   bold
inactive_tab_foreground #faf1ef
inactive_tab_background #8c4e5b
inactive_tab_font_style normal
tab_bar_background      #5e313d

# Pastel Pink Flower palette
# background / foreground
background              #6e3a47
foreground              #faf1ef

# Selection
selection_background    #f697aa
selection_foreground    #4b2a30

# Black / dark gray tones
color0  #4b2a30
color8  #d9aeb7

# Normal colors (1=red 2=green 3=yellow 4=blue 5=magenta 6=cyan 7=white)
color1  #ffa3b5
color2  #a8e5c6
color3  #f6c49a
color4  #b8b8f0
color5  #eec7ee
color6  #a8d8e5
color7  #faf1ef

# Bright colors
color9  #ffc2ce
color10 #bcebd3
color11 #f9ddb5
color12 #d5d5fa
color13 #fbd0fb
color14 #c5e8f0
color15 #ffffff

# Keyboard shortcuts
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0
