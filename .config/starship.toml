# Starship prompt - Pastel Pink Flower (dark rose)
# Colors: #f697aa (pink), #f6c49a (peach), #a8d8e5 (blue), #b8b8f0 (lavender), #a8e5c6 (mint)

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](bold #c69aa3)$os$username$hostname$directory$git_branch$git_status$python$nodejs$rust$golang$java$package
[╰─](bold #c69aa3)$character"""

add_newline = true

[character]
success_symbol = "[❯](bold #ffa3b5)"
error_symbol = "[✗](bold #ffd166)"
vimcmd_symbol = "[❮](bold #faf1ef)"

[os]
disabled = false
style = "bold #a8d8e5"

[os.symbols]
Fedora = " "
Linux = " "

[username]
style_user = "bold #f697aa"
style_root = "bold #ffb3c1"
format = "[$user]($style) "
show_always = false

[hostname]
style = "bold #f6c49a"
format = "[@$hostname]($style) "
ssh_only = true

[directory]
style = "bold #a8d8e5"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "#ffb3c1"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Videos" = " "

[git_branch]
symbol = " "
style = "bold #b8b8f0"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #f6c49a"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "󰄤"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[python]
symbol = " "
style = "bold #f6c49a"
format = "[$symbol($virtualenv )]($style)"

[nodejs]
symbol = " "
style = "bold #a8e5c6"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold #f6af97"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold #a8d8e5"
format = "[$symbol($version )]($style)"

[java]
symbol = " "
style = "bold #ffa3b5"
format = "[$symbol($version )]($style)"

[package]
symbol = "󰏗 "
style = "bold #b8b8f0"
format = "[$symbol$version]($style) "
disabled = false

[time]
disabled = true

[cmd_duration]
min_time = 2000
format = "took [$duration](bold #f7d6a0) "
